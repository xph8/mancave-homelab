apiVersion: v1
kind: Pod
metadata:
  name: sonarr
spec:
  containers:
  - name: sonarr
    image: lscr.io/linuxserver/sonarr
    ports:
    - hostPort: 8989
    env:
    - name: TZ
      value: Etc/UTC
    - name: PUID
      value: 1000
    - name: PGID
      value: 1000
    volumeMounts:
    - name: config
      mountPath: /config:Z
    - name: storage
      mountPath: /storage:z
  volumes:
  - name: config
    hostPath:
      path: /home/xph8/Auxiliary/Trackers/sonarr/config
      type: DirectoryOrCreate
  - name: storage
    hostPath:
      path: /home/xph8/Auxiliary/Trackers/storage
